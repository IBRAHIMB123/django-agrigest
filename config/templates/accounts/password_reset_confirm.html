{% extends 'base.html' %}

{% block title %}Nouveau mot de passe | AgriGest{% endblock %}

{% block auth_content %}
  <div class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">Définir un nouveau mot de passe</h1>
      <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-btn" style="width: 100%;">Valider</button>
      </form>
    </div>
  </div>
{% endblock %}
