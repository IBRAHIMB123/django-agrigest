{% extends 'base.html' %}

{% block title %}Réinitialisation | AgriGest{% endblock %}

{% block auth_content %}
  <div class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">Réinitialiser le mot de passe</h1>
      <p class="auth-subtitle">Saisissez votre adresse email pour recevoir le lien de réinitialisation.</p>
      <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">Email</label>
          {{ form.email }}
        </div>
        <button type="submit" class="primary-btn" style="width: 100%;">Envoyer le lien</button>
      </form>
    </div>
  </div>
{% endblock %}
